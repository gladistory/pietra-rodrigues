# Publica a pasta site/ no branch gh-pages. Não há build: o site é HTML/CSS/JS puro.
#
# Domínio personalizado na raiz: https://piettra-rodrigues.com.br/
# (O ficheiro site/CNAME aponta o GitHub Pages para esse hostname.)
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A rota /dec serve o mesmo conteúdo da home (era uma rota do Angular).
      # A cópia é feita aqui para existir um único index.html como fonte da verdade.
      - name: Gerar /dec e fallback 404
        run: |
          mkdir -p site/dec
          cp site/index.html site/dec/index.html
          cp site/index.html site/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
